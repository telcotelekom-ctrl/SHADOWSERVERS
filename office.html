<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanziers01 – Online Office</title>
  <style>
    :root {
      --bg: #07111d;
      --panel: rgba(7,17,29,0.9);
      --text: #f5f7ff;
      --muted: #9fb0c9;
      --accent: #4f8cff;
      --accent-2: #f4c542;
      --border: rgba(255,255,255,0.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: linear-gradient(135deg, #07111d 0%, #11233d 100%); color: var(--text); }
    .page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; box-shadow: 0 18px 44px rgba(0,0,0,0.24); }
    .topbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .link { text-decoration: none; color: var(--text); padding: 10px 14px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid var(--border); font-weight: 700; }
    h1, h2 { margin-top: 0; }
    p { color: var(--muted); }
    label { display: block; margin-bottom: 12px; font-weight: 700; }
    input, textarea, button { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); font: inherit; margin-top: 6px; }
    textarea { min-height: 110px; resize: vertical; }
    button { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #07111d; font-weight: 800; cursor: pointer; }
    .result { margin-top: 16px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,0.08); color: var(--text); }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="link" href="./index.html">← Portal</a>
      <a class="link" href="./master-dokument.html">Master-Dokument</a>
      <a class="link" href="./handbuch.html">Handbuch</a>
    </div>
    <section class="card">
      <h1>Online Office · Teilnahme & Support</h1>
      <p>Hier kann jeder Nutzer sein eigenes Ergebnis, seine Interessen und seine Zukunftsabsicht klar eingeben. Das Unternehmen kann den nächsten Schritt mit Unterstützung begleiten und daraus eine echte Verbindung entwickeln.</p>
      <form id="officeForm">
        <label>Vor- und Nachname<input id="name" required></label>
        <label>Interesse / Fokus<input id="focus" required></label>
        <label>Eigene Vision<textarea id="vision" required></textarea></label>
        <label>Unterstützung / Ziel<textarea id="support" required></textarea></label>
        <button type="submit">Ergebnis übermitteln</button>
      </form>
      <div id="result" class="result" hidden></div>
    </section>
  </main>
  <script>
    const form = document.getElementById('officeForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        focus: document.getElementById('focus').value,
        vision: document.getElementById('vision').value,
        support: document.getElementById('support').value
      };
      const response = await fetch('/server/api/office/participation', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await response.json();
      result.hidden = false;
      result.innerHTML = `<strong>Erfolgreich gespeichert.</strong><br>${data.message}<br><br>Ihre Eingabe wird im Online Office als eigener Teilnahme- und Unterstützungsbeitrag festgehalten.`;
      form.reset();
    });
  </script>
</body>
</html>
