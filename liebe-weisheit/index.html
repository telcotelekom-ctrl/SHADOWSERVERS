                    <blockquote class="text-sm italic text-gray-700">
                        "${item.text}"
                    </blockquote>
                    <div class="mt-2 text-xs text-gray-600">
                        <strong>Concepten:</strong> ${(item.ai_themas && Array.isArray(item.ai_themas) ? item.ai_themas.join(', ') : 'Geen concepten')}
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }
        // Reflection functions
        function setEmotion(emotion, event) {
            currentEmotion = emotion;
            loadWisdomForEmotion(emotion);

            // Update button states
            document.querySelectorAll('.emotion-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-purple-500');
            });
            if (event && event.target) {
                event.target.classList.add('ring-2', 'ring-purple-500');
            }
        }
        function loadWisdomForEmotion(emotion) {
            const container = document.getElementById('wisdom-selection');
            if (!container) return;

            const emotionWisdomMap = {
                'vreugde': ['blijdschap', 'geluk', 'vreugde', 'zalig'],
                'rust': ['rust', 'vrede', 'kalm', 'sereniteit'],
                'twijfel': ['wijsheid', 'geloof', 'vertrouwen', 'hoop'],
                'dankbaarheid': ['dankbaarheid', 'lof', 'prijs', 'eer'],
                'zorgen': ['angst', 'zorgen', 'vrees', 'troost']
            };

            const emotionKeywords = emotionWisdomMap[emotion] || [];

            const relevantWisdom = wisdomData.filter(item => {
                if (!item.text || !item.ai_themas) return false;

                const textLower = item.text.toLowerCase();
                const themesLower = item.ai_themas.join(' ').toLowerCase();

                return emotionKeywords.some(keyword =>
                    textLower.includes(keyword) || themesLower.includes(keyword)
                );
            }).slice(0, 6);

            const displayWisdom = relevantWisdom.length > 0 ? relevantWisdom : wisdomData.slice(0, 6);

            const html = displayWisdom.map(item => {
                const reference = item.book && item.chapter && item.verse
                    ? `${item.book} ${item.chapter}:${item.verse}`
                    : item.tradition;

                return `
                    <div class="wisdom-card bg-white rounded-lg p-4 mb-3 cursor-pointer hover:shadow-md transition-shadow" data-wisdom-id="${item.id}">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" id="wisdom-${item.id}" value="${item.id}" class="wisdom-checkbox mt-1">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="tradition-badge ${(item.tradition || '').toLowerCase()}">${item.tradition}</span>
                                    <span class="text-xs text-gray-500">${reference}</span>
                                </div>
                                <blockquote class="text-sm italic text-gray-600 mb-2">
                                    "${item.text}"
                                </blockquote>
                                <div class="flex flex-wrap gap-1">
                                    ${(item.ai_themas && Array.isArray(item.ai_themas) ? item.ai_themas.slice(0, 3).map(theme =>
                                        `<span class="text-xs px-2 py-1 bg-blue-100 text-blue-800 rounded">${theme}</span>`
                                    ).join('') : '')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;

            // Add event listeners
            document.querySelectorAll('.wisdom-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = this.querySelector('.wisdom-checkbox');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            this.classList.toggle('selected', checkbox.checked);
                        }
                    }
                });
            });
        }
        function saveReflection() {
            const reflectionTextInput = document.getElementById('reflection-text');
            if (!reflectionTextInput) return;

            const reflectionText = reflectionTextInput.value.trim();
            const selectedWisdom = Array.from(document.querySelectorAll('.wisdom-checkbox:checked'))
                .map(cb => cb.value);

            if (!currentEmotion || !reflectionText) {
                showMessage('Selecteer een emotie en schrijf je reflectie');
                return;
            }

            if (reflectionText.length < 10) {
                showMessage('Schrijf een wat langere reflectie (minimaal 10 karakters)');
                return;
            }

            const reflection = {
                id: Date.now(),
                emotion: currentEmotion,
                text: reflectionText,
                wisdom: selectedWisdom,
                date: new Date().toISOString()
            };

            // Get existing reflections
            let reflections = JSON.parse(localStorage.getItem('liefde-weisheit-reflections') || '[]');
            reflections.push(reflection);
            localStorage.setItem('liefde-weisheit-reflections', JSON.stringify(reflections));

            // Clear form
            reflectionTextInput.value = '';
            document.querySelectorAll('.wisdom-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('.wisdom-card').forEach(card => card.classList.remove('selected'));

            showMessage('Reflectie opgeslagen!', 'success');
            loadSavedReflections();
        }
        function loadSavedReflections() {
            const container = document.getElementById('saved-reflections');
            if (!container) return;

            const reflections = JSON.parse(localStorage.getItem('liefde-weisheit-reflections') || '[]');

            if (reflections.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Nog geen reflecties opgeslagen</p>';
                return;
            }

            const html = reflections.map(reflection => `
                <div class="mb-4 p-4 bg-gray-50 rounded-lg">
                    <div class="flex justify-between items-start mb-2">
                        <span class="emotion-badge px-2 py-1 bg-purple-100 text-purple-800 rounded-full text-sm">${reflection.emotion}</span>
                        <span class="text-xs text-gray-500">${new Date(reflection.date).toLocaleDateString()}</span>
                    </div>
                    <p class="text-gray-700 mb-2">${reflection.text}</p>
                    ${reflection.wisdom && reflection.wisdom.length > 0 ? `
                        <div class="text-xs text-gray-500">
                            <i class="fas fa-book-open mr-1"></i>
                            ${reflection.wisdom.length} wijsheidsteksten geselecteerd
                        </div>
                    ` : ''}
                </div>
            `).join('');

            container.innerHTML = html;
        }
        // Advanced search functions
        function setSearchType(type) {
            currentSearchType = type;

            // Update button states
            document.querySelectorAll('.search-type-btn').forEach(btn => {
                btn.classList.remove('ring-2', 'ring-purple-500');
            });

            const targetButton = Array.from(document.querySelectorAll('.search-type-btn')).find(btn =>
                btn.getAttribute('data-search-type') === type
            );
            if (targetButton) {
                targetButton.classList.add('ring-2', 'ring-purple-500');
            }
        }
        async function performAdvancedSearch() {
            const searchInput = document.getElementById('advanced-search-input');
            const confidenceSelect = document.getElementById('confidence-threshold');
            const limitSelect = document.getElementById('results-limit');
            const languageSelect = document.getElementById('language-focus');

            if (!searchInput) return;

            const query = searchInput.value.trim();
            if (!query) {
                showMessage('Voer een zoekopdracht in');
                return;
            }

            // Update settings
            confidenceThreshold = parseFloat(confidenceSelect?.value || 0.7);
            resultsLimit = parseInt(limitSelect?.value || 10);
            const languageFocus = languageSelect?.value || 'all';

            let allResults = [];

            // Search based on type
            if (currentSearchType === 'all' || currentSearchType === 'semantic') {
                if (semanticMapper) {
                    try {
                        const semanticResults = await semanticMapper.matchSemanticQuery(query);
                        if (semanticResults.matches.length > 0) {
                            const converted = convertSemanticResults(semanticResults)
                                .filter(r => !r.confidence || r.confidence >= confidenceThreshold)
                                .slice(0, resultsLimit);
                            allResults = allResults.concat(converted);
                        }
                    } catch (error) {
                        console.error('Semantic mapping error:', error);
                    }
                }
            }

            if (currentSearchType === 'all' || currentSearchType === 'parabiblical') {
                if (parabiblicalMatcher) {
                    try {
                        const paraResults = await parabiblicalMatcher.matchQuery(query, { fuzzyThreshold: confidenceThreshold });
                        if (paraResults.matches.length > 0) {
                            const converted = convertParabiblicalResults(paraResults)
                                .filter(r => !r.confidence || r.confidence >= confidenceThreshold)
                                .slice(0, resultsLimit);
                            allResults = allResults.concat(converted);
                        }
                    } catch (error) {
                        console.error('Parabiblical matching error:', error);
                    }
                }
            }

            if (currentSearchType === 'all' || currentSearchType === 'basic') {
                // Search in embedded wisdom data
                let basicResults = wisdomData.filter(item =>
                    (item.text && item.text.toLowerCase().includes(query.toLowerCase())) ||
                    (item.ai_themas && item.ai_themas.some(theme => theme.toLowerCase().includes(query.toLowerCase()))) ||
                    (item.ai_vragen && item.ai_vragen.some(vraag => vraag.toLowerCase().includes(query.toLowerCase()))) ||
                    (item.theological_concept && item.theological_concept.toLowerCase().includes(query.toLowerCase()))
                );

                // Add fallback data for all traditions to ensure comprehensive results
                const allTraditions = ['Sikhisme', 'Confucianisme', 'Taoisme', 'Shinto', 'Zoroastrisme'];
                allTraditions.forEach(trad => {
                    const fallbackData = generateTraditionFallback(trad, query.toLowerCase());
                    basicResults = basicResults.concat(fallbackData);
                });

                // Add ultimate fallback if still no results
                if (basicResults.length === 0) {
                    basicResults = basicResults.concat(generateFallbackResults(query.toLowerCase()));
                }

                // Apply limit after combining all results
                basicResults = basicResults.slice(0, resultsLimit);
                allResults = allResults.concat(basicResults);
            }

            // ULTIMATE FALLBACK - Ensure every word gets results in advanced search too
            if (allResults.length === 0) {
                allResults = generateFallbackResults(query);
            }

            // Sort by confidence if available
            allResults.sort((a, b) => (b.confidence || 0) - (a.confidence || 0));

            displayAdvancedSearchResults(allResults, query);
        }
        function displayAdvancedSearchResults(results, query) {
            const resultsContainer = document.getElementById('advanced-search-results');
            if (!resultsContainer) return;

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="col-span-2 text-center py-8">
                        <i class="fas fa-search text-4xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">Geen resultaten gevonden voor "${query}"</p>
                        <p class="text-sm text-gray-400 mt-2">Probeer een andere zoekterm of verlaag de confidence drempel</p>
                    </div>
                `;
                return;
            }

            // Group results by type
            const groupedResults = {
                semantic: results.filter(r => r.matchType === 'semantic'),
                parabiblical: results.filter(r => r.matchType === 'parabiblical'),
                basic: results.filter(r => !r.matchType),
                fallback: results.filter(r => r.matchType === 'fallback'),
                general: results.filter(r => r.matchType === 'general')
            };

            let html = '';

            // Display each group
            if (groupedResults.semantic.length > 0) {
                html += `
                    <div class="col-span-2 mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-blue-800">🧠 Semantische Resultaten (${groupedResults.semantic.length})</h3>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                            ${groupedResults.semantic.map(item => createWisdomCard(item)).join('')}
                        </div>
                    </div>
                `;
            }

            if (groupedResults.parabiblical.length > 0) {
                html += `
                    <div class="col-span-2 mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-green-800">📚 Parabiblische Resultaten (${groupedResults.parabiblical.length})</h3>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                            ${groupedResults.parabiblical.map(item => createWisdomCard(item)).join('')}
                        </div>
                    </div>
                `;
            }

            if (groupedResults.fallback.length > 0) {
                html += `
                    <div class="col-span-2 mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-purple-800">🔍 Persoonlijke Reflectie (${groupedResults.fallback.length})</h3>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                            ${groupedResults.fallback.map(item => createWisdomCard(item)).join('')}
                        </div>
                    </div>
                `;
            }

            if (groupedResults.general.length > 0) {
                html += `
                    <div class="col-span-2 mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-indigo-800">✨ Algemene Wijsheid (${groupedResults.general.length})</h3>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                            ${groupedResults.general.map(item => createWisdomCard(item)).join('')}
                        </div>
                    </div>
                `;
            }

            if (groupedResults.basic.length > 0) {
                html += `
                    <div class="col-span-2 mb-6">
                        <h3 class="text-lg font-semibold mb-3 text-gray-800">📖 Basis Resultaten (${groupedResults.basic.length})</h3>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
                            ${groupedResults.basic.map(item => createWisdomCard(item)).join('')}
                        </div>
                    </div>
                `;
            }

            resultsContainer.innerHTML = html;
        }
        // Message system
        function showMessage(message, type = 'error') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-green-500' : 'bg-blue-500';

            toast.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 max-w-md`;
            toast.innerHTML = `
                <div class="flex items-center">
                    <i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'} mr-2"></i>
                    <span>${message}</span>
                    <button class="toast-close ml-4 text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;

            document.body.appendChild(toast);

            // Add event listener for close button
            const closeBtn = toast.querySelector('.toast-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                });
            }

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }
    </script>
</body>
