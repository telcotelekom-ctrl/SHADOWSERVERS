/* ============================================================
   VOS KNOWLEDGE NETWORK — EINE DATEI. KEINE ORDNER. KEINE ABHÄNGIGKEITEN.
   Autor: Raymond Demitrio Tel · TEL1.NL · DigitalNotar.in · GentlyOverdone.com

/* --- 7 wählbare Design-Stile über data-theme --- */
:root{
  --bg:#0a0d14; --bg2:#111726; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --text:#f4f1e6; --muted:#9aa7bd; --accent:#c9a24b; --accent2:#4f8cff;
  --border:rgba(255,255,255,.14); --ok:#7ff0ad; --bad:#ff8a8a; --warn:#ffcf6b;
  --radius:14px; --font:"Segoe UI",Tahoma,sans-serif; --serif:Georgia,"Times New Roman",serif;
  --glow:0 0 0 rgba(0,0,0,0);
}
body[data-theme="wood"]{ --bg:#1a1109; --bg2:#241708; --panel:rgba(201,162,75,.08); --accent:#c9a24b; --accent2:#e0b866; --text:#f4ecd8; --border:rgba(201,162,75,.28); --font:var(--serif); }
body[data-theme="golden"]{ --bg:#0c0a05; --bg2:#161005; --panel:rgba(212,175,55,.08); --accent:#d4af37; --accent2:#f4d67a; --text:#faf3dc; --border:rgba(212,175,55,.35); --font:var(--serif); }
body[data-theme="glass"]{ --bg:#0e1420; --bg2:#141d2e; --panel:rgba(255,255,255,.09); --panel2:rgba(255,255,255,.14); --accent:#8fd3ff; --accent2:#c7b6ff; --text:#eaf2ff; --border:rgba(255,255,255,.22); }
body[data-theme="neon"]{ --bg:#05060f; --bg2:#0a0b1c; --panel:rgba(255,0,200,.06); --accent:#ff3df0; --accent2:#00f0ff; --text:#eafcff; --border:rgba(0,240,255,.32); --glow:0 0 14px rgba(0,240,255,.45); }
body[data-theme="museum"]{ --bg:#f4f1e8; --bg2:#e9e4d6; --panel:rgba(0,0,0,.03); --panel2:rgba(0,0,0,.06); --accent:#8a6d3b; --accent2:#4a5d7a; --text:#20242c; --muted:#5a6472; --border:rgba(0,0,0,.16); --font:var(--serif); }
body[data-theme="blueprint"]{ --bg:#071a2f; --bg2:#0a2440; --panel:rgba(120,190,255,.07); --accent:#7fc4ff; --accent2:#bfe0ff; --text:#e5f2ff; --border:rgba(127,196,255,.3); }
body[data-theme="hud"]{ --bg:#03110c; --bg2:#062018; --panel:rgba(0,255,170,.06); --accent:#2affb0; --accent2:#7dffd6; --text:#e6fff5; --border:rgba(42,255,176,.3); --glow:0 0 12px rgba(42,255,176,.4); }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font); background:radial-gradient(circle at 22% -5%, var(--bg2) 0%, var(--bg) 62%);
  color:var(--text); line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
  transition:background .4s, color .4s;
}
a{ color:var(--accent2); text-decoration:none; }
a:hover{ text-decoration:underline; }

/* header */
header.top{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 18px;
  border-bottom:1px solid var(--border); background:var(--panel); backdrop-filter:blur(6px); position:sticky; top:0; z-index:50; }
.brand{ display:flex; flex-direction:column; line-height:1.1; }
.brand b{ font-size:1.05rem; letter-spacing:.5px; }
.brand small{ color:var(--muted); font-size:.72rem; letter-spacing:2px; text-transform:uppercase; }
.kicker{ padding:5px 11px; border-radius:999px; background:rgba(201,162,75,.18); color:var(--accent);
  font-weight:800; font-size:.72rem; letter-spacing:1px; border:1px solid var(--border); }
.top .spacer{ flex:1; }
.themebar{ display:flex; gap:6px; flex-wrap:wrap; }
.themebar button{ width:26px; height:26px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0; }
.themebar button.active{ outline:2px solid var(--accent); outline-offset:2px; }
.portal-link{ font-weight:700; font-size:.85rem; }

/* layout */
.shell{ display:grid; grid-template-columns:220px 1fr; gap:0; align-items:start; }
@media(max-width:920px){ .shell{ grid-template-columns:1fr; } nav.modules{ flex-direction:row!important; overflow-x:auto; } }

nav.modules{ display:flex; flex-direction:column; gap:4px; padding:14px; border-right:1px solid var(--border);
  position:sticky; top:57px; }
nav.modules button{ display:flex; align-items:center; gap:9px; text-align:left; width:100%; padding:9px 11px;
  border:1px solid transparent; border-radius:10px; background:transparent; color:var(--muted);
  font-family:inherit; font-weight:600; font-size:.9rem; cursor:pointer; transition:.15s; }
nav.modules button:hover{ background:var(--panel); color:var(--text); }
nav.modules button.active{ background:var(--panel2); color:var(--text); border-color:var(--border); box-shadow:var(--glow); }
nav.modules button .ic{ font-size:1.05rem; width:20px; text-align:center; }

main{ padding:18px 22px 60px; min-height:calc(100vh - 57px); }
.view{ display:none; animation:fade .35s ease; }
.view.active{ display:block; }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

h1.title{ font-size:1.5rem; margin:0 0 4px; }
.sub{ color:var(--muted); margin:0 0 18px; font-size:.92rem; }
.card{ border:1px solid var(--border); border-radius:var(--radius); padding:16px; background:var(--panel); margin-bottom:16px; box-shadow:var(--glow); }
.card h2{ margin:0 0 10px; font-size:1.02rem; color:var(--accent); }
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
.g3{ grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }

/* search */
.searchwrap{ position:relative; max-width:760px; }
.searchbox{ display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:14px;
  background:var(--panel2); padding:4px 6px 4px 14px; box-shadow:var(--glow); }
.searchbox span.mag{ font-size:1.2rem; color:var(--muted); }
#q{ flex:1; border:0; background:transparent; color:var(--text); font-size:1.05rem; padding:12px 4px; outline:none; font-family:inherit; }
.searchbox button{ border:0; border-radius:10px; background:var(--accent); color:#1a1109; font-weight:800; padding:11px 18px; cursor:pointer; font-family:inherit; }
.suggest{ position:absolute; left:0; right:0; top:100%; margin-top:6px; background:var(--bg2); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; z-index:40; display:none; box-shadow:0 12px 40px rgba(0,0,0,.5); }
.suggest.open{ display:block; }
.suggest div{ padding:10px 14px; cursor:pointer; font-size:.92rem; display:flex; justify-content:space-between; gap:10px; }
.suggest div small{ color:var(--muted); }
.suggest div:hover, .suggest div.hl{ background:var(--panel2); }

.pipeline{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px; }
.stage{ font-size:.72rem; padding:4px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
.stage.hit{ color:var(--ok); border-color:var(--ok); }
.stage.miss{ opacity:.4; }

.result{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--panel); }
.result h3{ margin:0 0 4px; font-size:1.02rem; }
.result .meta{ font-size:.72rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.tag{ padding:2px 8px; border-radius:999px; background:var(--panel2); border:1px solid var(--border); font-size:.68rem; }
.result p{ margin:6px 0 0; font-size:.9rem; color:var(--text); }
mark{ background:rgba(201,162,75,.35); color:inherit; padding:0 2px; border-radius:3px; }

.related-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--panel2);
  cursor:pointer; font-size:.82rem; transition:.15s; }
.chip:hover{ border-color:var(--accent); color:var(--accent); }

.ai-summary{ border-left:3px solid var(--accent2); padding:10px 14px; background:var(--panel2); border-radius:0 10px 10px 0; font-size:.92rem; }
.corrected{ color:var(--warn); font-size:.86rem; margin:6px 0; }
.corrected b{ cursor:pointer; text-decoration:underline; }

.fallback{ border:1px dashed var(--border); border-radius:12px; padding:18px; background:var(--panel); }
.fallback h3{ margin:0 0 6px; color:var(--accent); }
.fallback label{ display:block; font-size:.78rem; color:var(--muted); margin:10px 0 3px; }
.fallback input, .fallback textarea, select.styled{ width:100%; padding:9px 11px; border-radius:9px;
  border:1px solid var(--border); background:var(--bg2); color:var(--text); font-family:inherit; font-size:.9rem; }
.fallback button, .btn{ margin-top:12px; border:1px solid var(--border); border-radius:9px; padding:10px 16px;
  background:var(--accent); color:#1a1109; font-weight:800; cursor:pointer; font-family:inherit; }
.btn.ghost{ background:transparent; color:var(--text); }
.hidden{ display:none!important; }

/* knowledge net svg */
.net-wrap{ width:100%; overflow:auto; border-radius:12px; border:1px solid var(--border); background:var(--bg2); }
svg.net{ width:100%; height:340px; display:block; }
.node circle{ transition:.2s; cursor:pointer; }
.node text{ fill:var(--text); font-size:11px; font-family:var(--font); pointer-events:none; }
.edge{ stroke:var(--border); stroke-width:1.5; }

/* developer cockpit */
.gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.gauge{ border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--panel); }
.gauge .lbl{ font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.gauge .val{ font-size:1.4rem; font-weight:800; margin:2px 0 6px; }
.bar{ height:7px; border-radius:999px; background:var(--panel2); overflow:hidden; }
.bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:999px; transition:width .5s; }
.spark{ width:100%; height:34px; display:block; }

/* storage vault */
.vault-head{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
.vault-total{ flex:1; min-width:220px; }
.capbar{ height:16px; border-radius:999px; background:var(--panel2); overflow:hidden; border:1px solid var(--border); }
.capbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s; }
.slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:14px; }
.slot{ border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--panel); position:relative; }
.slot.locked{ opacity:.5; border-style:dashed; }
.slot h4{ margin:0 0 4px; font-size:.9rem; display:flex; justify-content:space-between; align-items:center; }
.slot .use{ font-size:.72rem; color:var(--muted); }
.slot .mini{ height:6px; border-radius:999px; background:var(--panel2); margin:6px 0; overflow:hidden; }
.slot .mini i{ display:block; height:100%; background:var(--accent2); }
.slot textarea{ width:100%; height:56px; resize:vertical; font-size:.78rem; background:var(--bg2); color:var(--text);
  border:1px solid var(--border); border-radius:8px; padding:6px; font-family:"Cascadia Code",Consolas,monospace; }
.slot .row{ display:flex; gap:6px; margin-top:6px; }
.slot .row button{ flex:1; border:1px solid var(--border); border-radius:7px; background:var(--panel2);
  color:var(--text); font-size:.72rem; padding:5px; cursor:pointer; font-family:inherit; }
.slot .row button:hover{ border-color:var(--accent); }

.diagram{ font-family:"Cascadia Code",Consolas,monospace; font-size:.78rem; white-space:pre; color:var(--muted);
  overflow-x:auto; border:1px solid var(--border); border-radius:10px; padding:14px; background:var(--bg2); }

.manifest-img{ max-width:340px; width:100%; border-radius:12px; border:1px solid var(--border); box-shadow:0 10px 40px rgba(0,0,0,.5); display:block; }
.two-col{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
@media(max-width:760px){ .two-col{ grid-template-columns:1fr; } .manifest-img{ max-width:100%; } }

.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg2);
  border:1px solid var(--accent); color:var(--text); padding:11px 18px; border-radius:10px; opacity:0; transition:.3s; z-index:200; box-shadow:var(--glow); }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
footer{ padding:24px 22px; border-top:1px solid var(--border); color:var(--muted); font-size:.8rem; text-align:center; }
</style>

const SYNONYMS = {
  auto:["pkw","fahrzeug","mobilitaet","wagen"], pkw:["auto","fahrzeug"], fahrzeug:["auto","pkw","mobilitaet"],
  energie:["strom","kraft","power","energiegewinnung"], strom:["energie","elektrizitaet","elektro"],
  elektro:["elektrizitaet","elektronik","elektrotechnik","strom"], elektrizitaet:["strom","elektro"],
  material:["werkstoff","stoff","stahl","aluminium","titan"], werkstoff:["material"],
  wissen:["knowledge","lernen","bildung","enzyklopaedie"], suche:["search","finden","index"],
  ki:["ai","intelligenz","assistent"], ai:["ki","intelligenz"],
  reise:["travel","mobilitaet","ort"], code:["developer","programmieren","entwickler"],
  denken:["manifest","freiheit","thinking","ueberzeugung"], physik:["formel","science","naturwissenschaft"],
};

/* ---------- 3. TEXT-WERKZEUGE ---------- */
function normalize(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function tokenize(s){ return normalize(s).split(" ").filter(Boolean); }
function lev(a,b){ const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){ const c=a[i-1]===b[j-1]?0:1;
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+c); } return dp[m][n]; }

/* pre-index */
DB.forEach(doc=>{ doc._t=normalize(doc.t); doc._k=(doc.k||[]).map(normalize);
  doc._all=[doc._t,...doc._k,normalize(doc.d),normalize(doc.a)].join(" "); doc._tok=tokenize(doc._all); });

/* ---------- 4. CACHE (wiederholte Suchbegriffe → direkt) ---------- */
const CACHE = new Map(); const CACHE_MAX=80;
function cacheGet(k){ return CACHE.get(k); }
function cachePut(k,v){ if(CACHE.size>=CACHE_MAX){ CACHE.delete(CACHE.keys().next().value); } CACHE.set(k,v); }

/* ---------- 5. SUCH-STUFEN: exakt → semantisch → verwandt → KI ---------- */
function expand(tokens){ const out=new Set(tokens); tokens.forEach(t=>{ (SYNONYMS[t]||[]).forEach(s=>out.add(normalize(s))); }); return [...out]; }
function scoreDoc(doc,qtok,extok){
  let s=0, exact=false;
  qtok.forEach(t=>{ if(doc._t===t){s+=12;exact=true;} else if(doc._t.includes(t)){s+=6;exact=true;}
    if(doc._k.includes(t)){s+=8;exact=true;} });
  extok.forEach(t=>{ doc._tok.forEach(dt=>{ if(dt===t)s+=3; else if(dt.includes(t)&&t.length>3)s+=1;
    else if(t.length>3&&lev(dt,t)<=1)s+=2; }); });
  return {s, exact};
}
function search(text){
  const key=normalize(text); if(!key) return {query:text,results:[],related:[],corrected:null,ai:null,exact:false,cached:false};
  const cached=cacheGet(key); if(cached){ STATE.metrics.cacheHits++; return {...cached,cached:true}; }
  const qtok=tokenize(text), extok=expand(qtok);
  let scored=DB.map(d=>({d,...scoreDoc(d,qtok,extok)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  let corrected=null;
  if(!scored.length){ // Tippfehler-Korrektur
    let best=null,bd=99; DB.forEach(d=>d._tok.forEach(dt=>{ qtok.forEach(t=>{ if(t.length>3){ const l=lev(dt,t); if(l<bd&&l<=2){bd=l;best=dt;} } }); }));
    if(best){ corrected=best; const r=search(best); r.corrected=best; r.cached=false; return r; }
  }
  const exact=scored.some(x=>x.exact);
  const results=scored.slice(0,8).map(x=>x.d);
  // verwandte Themen (gleicher Bereich + Semantik)
  const relSet=new Set(); results.forEach(r=>{ DB.forEach(d=>{ if(d!==r && d.a===r.a) relSet.add(d.t); }); });
  results.forEach(r=>relSet.delete(r.t));
  const related=[...relSet].slice(0,8);
  const ai = buildAISummary(text,results,related);
  const out={query:text,results,related,corrected,ai,exact};
  cachePut(key,out); return out;
}
function buildAISummary(q,results,related){
  if(!results.length) return null;
  const areas=[...new Set(results.map(r=>r.a))];
  const topics=results.slice(0,4).map(r=>r.t).join(", ");
  return `Zu „${q}" verbinden sich vor allem die Bereiche ${areas.join(" · ")}. `+
    `Gemeinsamer Kern: ${topics}. `+
    (related.length?`Verwandt und oft im selben Zusammenhang gesucht: ${related.slice(0,4).join(", ")}.`:"");
}
function suggest(text,limit){
  const n=normalize(text); if(!n) return [];
  const scored=[]; DB.forEach(d=>{ let sc=0;
    if(d._t.startsWith(n))sc=100; else if(d._t.includes(n))sc=60;
    else if(d._k.some(k=>k.startsWith(n)))sc=50; else if(d._k.some(k=>k.includes(n)))sc=30;
    else if(n.length>3 && lev(d._t.slice(0,n.length),n)<=1)sc=20;
    if(sc)scored.push({t:d.t,a:d.a,sc}); });
  return scored.sort((a,b)=>b.sc-a.sc).slice(0,limit||6);
}

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hi(text,q){ const toks=tokenize(q).filter(t=>t.length>2); let out=esc(text);
  toks.forEach(t=>{ out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }); return out; }

function wireKnowledge(){
  const q=document.getElementById('q'), sug=document.getElementById('suggest');
  let hlIdx=-1;
  function render(){ const items=suggest(q.value,6);
    if(!items.length||!q.value){ sug.classList.remove('open'); return; }
    sug.innerHTML=items.map((it,i)=>`<div data-t="${esc(it.t)}" class="${i===hlIdx?'hl':''}">${esc(it.t)}<small>${it.a}</small></div>`).join("");
    sug.classList.add('open');
    [...sug.children].forEach(c=>c.onclick=()=>{ q.value=c.dataset.t; sug.classList.remove('open'); doSearch(); });
  }
  q.addEventListener('input',()=>{ hlIdx=-1; render(); });
  q.addEventListener('keydown',e=>{ const items=[...sug.children];
    if(e.key==='ArrowDown'){ hlIdx=Math.min(hlIdx+1,items.length-1); render(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hlIdx=Math.max(hlIdx-1,0); render(); e.preventDefault(); }
    else if(e.key==='Enter'){ if(hlIdx>=0&&items[hlIdx]){ q.value=items[hlIdx].dataset.t; } sug.classList.remove('open'); doSearch(); }
    else if(e.key==='Escape'){ sug.classList.remove('open'); } });
  document.getElementById('goBtn').onclick=doSearch;
  document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) sug.classList.remove('open'); });
  // Deep-link ?q=
  const dl=new URLSearchParams(location.search).get('q'); if(dl){ q.value=dl; doSearch(); }
}
function setPipeline(res){

  p.innerHTML=[
    ["Exakte Treffer",exact],["Semantische Treffer",semantic&&!exact?true:semantic],
    ["Verwandte Themen",related],["KI-Zusammenfassung",ai]
  ].map(([n,on])=>`<span class="stage ${on?'hit':'miss'}">${on?'●':'○'} ${n}</span>`).join("");
}
function doSearch(){

  if(res.results.length){
    html+=res.results.map(d=>`<div class="result"><h3>${hi(d.t,q)}</h3>
      <div class="meta"><span class="tag">${d.a}</span>${d.cached?'<span class="tag">⚡ Cache</span>':''}${d.img?'<span class="tag">🖼️ Manifest</span>':''}</div>

    if(res.related.length){ html+=`<div class="card"><h2>Verwandte Themen</h2><div class="related-chips">`+
      res.related.map(r=>`<span class="chip" data-q="${esc(r)}">${esc(r)}</span>`).join("")+`</div></div>`; }
    if(res.ai){ html+=`<div class="card"><h2>🤖 KI-Zusammenfassung</h2><div class="ai-summary">${esc(res.ai)}</div></div>`; }
  } else {
    html+=`<div class="fallback">
      <h3>Wir haben dazu noch keinen direkten Eintrag gefunden.</h3>
      <p>Möglicherweise interessieren Sie diese verwandten Themen:</p>

      <p style="margin-top:14px"><b>Oder:</b> Beschreiben Sie kurz, was Sie suchen. Wir nehmen neue Themen kontinuierlich auf.</p>
      <label>Schlagwort</label><input id="fbKey" value="${esc(q)}" />

      <label>Kontakt (optional)</label><input id="fbContact" placeholder="E-Mail oder Name" />
      <button id="fbSend">Anfrage senden</button><div id="fbOut" style="margin-top:10px;color:var(--ok)"></div>
    </div>`;
  }
  out.innerHTML=html; wireChips();
  const cbtn=out.querySelector('[data-c]'); if(cbtn){ cbtn.onclick=()=>{ document.getElementById('q').value=cbtn.dataset.c; doSearch(); }; }
  const edu=out.querySelector('[data-goedu]'); if(edu){ edu.onclick=e=>{ e.preventDefault(); switchModule('education'); }; }
  const fb=document.getElementById('fbSend'); if(fb){ fb.onclick=()=>saveRequest(fbKey.value,fbDesc.value,fbContact.value,'fbOut'); }
  // Research-Netz aktualisieren
  if(res.results.length) drawNet(res.results[0].t);
}

function drawNet(center){
  const svg=document.getElementById('netSvg'); if(!svg)return;
  const doc=DB.find(d=>d.t===center)||DB[0];
  const rel=DB.filter(d=>d!==doc && d.a===doc.a).slice(0,6);
  const W=svg.clientWidth||700, H=340, cx=W/2, cy=H/2;
  let s=`<line class="edge" x1="0" y1="0" x2="0" y2="0" style="display:none"/>`;
  const nodes=[];
  rel.forEach((r,i)=>{ const ang=(i/rel.length)*Math.PI*2; const R=Math.min(W,H)*0.33;
    const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
    s+=`<line class="edge" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    nodes.push({x,y,t:r.t}); });
  s+=`<g class="node"><circle cx="${cx}" cy="${cy}" r="42" fill="var(--accent)" opacity="0.9"/>`+
     `<text x="${cx}" y="${cy}" text-anchor="middle" dy="4" style="fill:#1a1109;font-weight:800">${esc(doc.t.slice(0,14))}</text></g>`;
  nodes.forEach(n=>{ s+=`<g class="node" data-t="${esc(n.t)}"><circle cx="${n.x}" cy="${n.y}" r="30" fill="var(--accent2)" opacity="0.85"/>`+
    `<text x="${n.x}" y="${n.y+46}" text-anchor="middle">${esc(n.t.slice(0,16))}</text></g>`; });
  svg.innerHTML=s;
  [...svg.querySelectorAll('.node[data-t]')].forEach(g=>g.onclick=()=>drawNet(g.dataset.t));
}

    box.innerHTML=COCKPIT.map((g,i)=>`<div class="gauge"><div class="lbl">${g.k}</div>
      <div class="val" id="cv${i}">–</div><div class="bar"><i id="cb${i}" style="width:0%"></i></div>
      <svg class="spark" id="cs${i}" viewBox="0 0 100 34" preserveAspectRatio="none"></svg></div>`).join("");
    box.dataset.built="1"; COCKPIT.forEach((g,i)=>cockpitState[i]=Array(20).fill(30));
  }
  stopCockpit();
  cockpitTimer=setInterval(()=>{
    COCKPIT.forEach((g,i)=>{
      const base= g.k==="Cache"? 60+STATE.metrics.cacheHits*2 : g.k==="Requests/s"? 20+STATE.metrics.queries : 40;
      const v=Math.max(2,Math.min(g.u==="%"?100:999, base + (Math.random()*30-15)));
      const disp = g.k==="Index"? DB.length : g.k==="Users"? Math.round(120+Math.random()*80) : Math.round(v);
      const cv=document.getElementById('cv'+i); if(cv) cv.textContent=disp+(g.u&&g.u!=="k"?" "+g.u:"");
      const cb=document.getElementById('cb'+i); if(cb) cb.style.width=Math.min(100, g.u==="%"?v:(v/999*100)+20)+"%";
      const arr=cockpitState[i]; arr.push(v); arr.shift();
      const sp=document.getElementById('cs'+i);
      if(sp){ const max=Math.max(...arr,1); const pts=arr.map((y,x)=>`${(x/(arr.length-1))*100},${34-(y/max)*32}`).join(" ");
        sp.innerHTML=`<polyline points="${pts}" fill="none" stroke="var(--accent2)" stroke-width="1.5"/>`; }
    });
  },900);
}
function stopCockpit(){ if(cockpitTimer){ clearInterval(cockpitTimer); cockpitTimer=null; } }

/* ---------- 14. DEVELOPER-SPEICHER — MINI-PLATZ MIT AUSBREITUNG ---------- */
const VKEY="vos.vault"; // { slots:[{id,name,data,cap}], expansions:n }
function loadVault(){ try{ return JSON.parse(localStorage.getItem(VKEY))||null; }catch(_){ return null; } }
function defaultVault(){ return { slots:[
  {id:1,name:"Kern",data:"// VOS Mini-Kern\n",cap:2048},
], expansions:0 }; }
function saveVault(v){ localStorage.setItem(VKEY,JSON.stringify(v)); }
let VAULT=loadVault()||defaultVault();
function bytesOf(s){ return new Blob([s||""]).size; }
function usedTotal(){ return VAULT.slots.reduce((a,s)=>a+bytesOf(s.data),0); }
function capTotal(){ return VAULT.slots.reduce((a,s)=>a+s.cap,0); }
function fmt(b){ return b<1024? b+" B" : b<1048576? (b/1024).toFixed(1)+" KB" : (b/1048576).toFixed(2)+" MB"; }
function wireVault(){
  renderVault();
  document.getElementById('expandBtn').onclick=()=>{
    VAULT.expansions++;
    const id=(VAULT.slots.reduce((m,s)=>Math.max(m,s.id),0))+1;
    const cap=2048*Math.pow(2,Math.min(VAULT.expansions,4)); // wächst: 4KB,8KB,16KB,32KB...
    VAULT.slots.push({id,name:"Modul "+id,data:"",cap});
    saveVault(VAULT); renderVault(); toast("Speicher erweitert: +"+fmt(cap)+" (Modul "+id+")");
  };
  document.getElementById('estimateBtn').onclick=async()=>{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      toast("Browser-Kontingent: ~"+fmt(e.quota||0)+" · belegt ~"+fmt(e.usage||0));
    } else toast("Kapazitäts-Schätzung in diesem Browser nicht verfügbar.");
  };
}
function renderVault(){
  const used=usedTotal(), cap=capTotal(); const pct=cap?Math.min(100,used/cap*100):0;
  document.getElementById('capText').textContent=fmt(used)+" / "+fmt(cap)+" ("+pct.toFixed(0)+"%)";
  document.getElementById('capBar').style.width=pct+"%";
  const box=document.getElementById('slots');
  box.innerHTML=VAULT.slots.map(s=>{ const u=bytesOf(s.data),p=s.cap?Math.min(100,u/s.cap*100):0;
    return `<div class="slot"><h4>${esc(s.name)} <span class="use">${fmt(u)}/${fmt(s.cap)}</span></h4>
      <div class="mini"><i style="width:${p}%"></i></div>
      <textarea data-id="${s.id}" placeholder="Daten in diesem Modul …">${esc(s.data)}</textarea>
      <div class="row"><button data-save="${s.id}">💾 Speichern</button><button data-grow="${s.id}">⬆ Größer</button><button data-del="${s.id}">🗑</button></div>
    </div>`; }).join("") +
    `<div class="slot locked"><h4>Nächstes Modul</h4><div class="mini"><i style="width:0%"></i></div>
     <p class="use" style="margin:8px 0">Klicke „Speicher erweitern" — die Kapazität verdoppelt sich pro Ausbau.</p></div>`;
  box.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.save;
    const ta=box.querySelector(`textarea[data-id="${id}"]`); const s=VAULT.slots.find(x=>x.id===id);
    if(bytesOf(ta.value)>s.cap){ toast("Modul voll — erst vergrößern."); return; }
    s.data=ta.value; saveVault(VAULT); renderVault(); toast("Modul "+id+" gespeichert."); });
  box.querySelectorAll('[data-grow]').forEach(b=>b.onclick=()=>{ const s=VAULT.slots.find(x=>x.id===+b.dataset.grow);
    s.cap*=2; saveVault(VAULT); renderVault(); toast(s.name+" → "+fmt(s.cap)); });
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(VAULT.slots.length<=1){ toast("Mindestens ein Modul bleibt."); return; }
    VAULT.slots=VAULT.slots.filter(x=>x.id!==+b.dataset.del); saveVault(VAULT); renderVault(); toast("Modul entfernt."); });
}

/* ---------- 15. AI STUDIO ---------- */
function wireAI(){
  const run=()=>{ const q=document.getElementById('aiq').value.trim(); if(!q)return;
    const res=search(q); const out=document.getElementById('aiOut');
    out.innerHTML=`<div class="ai-summary">${esc(res.ai||"Zu diesem Begriff liegen noch keine verbundenen Einträge vor. Beschreibe es im Support-Modul — wir nehmen es auf.")}</div>`+
      (res.related.length?`<div class="related-chips" style="margin-top:12px">${res.related.map(r=>`<span class="chip" data-q="${esc(r)}">${esc(r)}</span>`).join("")}</div>`:"");
    wireChips(); };
  document.getElementById('aiBtn').onclick=run;
  document.getElementById('aiq').addEventListener('keydown',e=>{ if(e.key==='Enter')run(); });
}

/* ---------- 16. SUPPORT + Anfragen ---------- */
function saveRequest(key,desc,contact,outId){
  const list=JSON.parse(localStorage.getItem('vos.requests')||'[]');
  list.push({key,desc,contact,ts:Date.now()}); localStorage.setItem('vos.requests',JSON.stringify(list));
  const o=document.getElementById(outId); if(o)o.textContent="✓ Danke! Ihr Thema wurde aufgenommen ("+list.length+" gespeichert).";
  toast("Anfrage gespeichert.");
}
function wireSupport(){
  const b=document.getElementById('spSend'); if(b)b.onclick=()=>saveRequest(spKey.value,spDesc.value,spContact.value,'spOut');
}

/* ---------- 17. CHIPS (klickbare verwandte Begriffe) ---------- */
function wireChips(){
  document.querySelectorAll('.chip[data-q]').forEach(c=>c.onclick=()=>{
    switchModule('knowledge'); const q=document.getElementById('q'); q.value=c.dataset.q; doSearch();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

/* ---------- 18. TOAST ---------- */
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- 19. BOOT ---------- */
buildThemebar(); buildNav(); buildMain(); switchModule('knowledge');
})();
</script>
