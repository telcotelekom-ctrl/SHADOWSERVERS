<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>PSY‑TEL Publikums‑Ansicht · Live Akkorde & Tempo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
      padding: 24px;
    }
    .status-dot { display:inline-block; width:10px; height:10px; border-radius:999px; background:#ef4444; margin-right:8px; }
    .status-dot.online { background:#22c55e; }
    .status-line { font-size: 13px; color: #9ca3af; letter-spacing: 0.08em; text-transform: uppercase; }
    .chords {
      font-size: clamp(2.5rem, 9vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1.3;
    }
    .meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: clamp(1rem, 2.4vw, 1.4rem);
      color: #a5b4fc;
    }
    .meta span { padding: 8px 16px; border-radius: 999px; background: #0b1120; border: 1px solid #1f2937; }
    .placeholder { color: #6b7280; font-size: 1.2rem; }
    .gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .gate input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #0b1120;
      color: #e5e7eb;
      font-size: 1rem;
    }
    .gate button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #6366f1;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .gate .error { color: #f87171; font-size: 0.9rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="status-line"><span id="statusDot" class="status-dot"></span><span id="statusText">Verbinde mit PSY‑TEL Hotspot …</span></div>

  <div id="gateBox" class="gate" style="display:none;">
    <div>Dieser Hotspot ist mit einem Zugangscode geschützt.</div>
    <input id="gatePasscode" type="password" placeholder="Zugangscode" />
    <button id="gateJoin">Beitreten</button>
    <div class="error" id="gateError"></div>
  </div>

  <div id="viewBox">
    <div id="chordsOut" class="chords placeholder">Warte auf Live‑Übertragung …</div>
    <div class="meta">
      <span id="tempoOut">— BPM</span>
      <span id="keyOut">— → —</span>
    </div>
  </div>

  <script>
    let ws;
    const room = new URLSearchParams(location.search).get("room") || "";
    let audienceToken = "";

    function setStatus(online, text) {
      document.getElementById("statusDot").classList.toggle("online", online);
      document.getElementById("statusText").textContent = text;
    }

    function showGate(show) {
      document.getElementById("gateBox").style.display = show ? "flex" : "none";
      document.getElementById("viewBox").style.display = show ? "none" : "block";
    }

    function applyState(state) {
      if (!state) return;
      const chordsEl = document.getElementById("chordsOut");
      chordsEl.textContent = state.chords || "Keine Akkorde";
      chordsEl.classList.toggle("placeholder", !state.chords);
      document.getElementById("tempoOut").textContent = (state.tempo || "—") + " BPM";
      document.getElementById("keyOut").textContent = (state.keyOrig || "—") + " → " + (state.keyTarget || "—");
    }

    async function loadInitialState() {
      try {
        const params = new URLSearchParams({ room });
        if (audienceToken) params.set("token", audienceToken);
        const response = await fetch("/server/api/hotspot/state?" + params.toString());
        const data = await response.json();
        if (data.success && data.state) {
          applyState(data.state);
        }
      } catch (error) {
        // Ignorieren – WebSocket liefert den Live-Stand nach.
      }
    }

    async function joinWithPasscode() {
      const passcode = document.getElementById("gatePasscode").value;
      const errorEl = document.getElementById("gateError");
      errorEl.textContent = "Prüfe …";
      try {
        const response = await fetch("/server/api/hotspot/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ room, passcode })
        });
        const data = await response.json();
        if (!data.success) {
          errorEl.textContent = "Ungültiger Zugangscode.";
          return;
        }
        audienceToken = data.token;
        errorEl.textContent = "";
        showGate(false);
        loadInitialState();
        connect();
      } catch (error) {
        errorEl.textContent = "Fehler: " + error.message;
      }
    }

    function connect() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const params = new URLSearchParams({ room, role: "audience" });
      if (audienceToken) params.set("token", audienceToken);
      ws = new WebSocket(protocol + "//" + location.host + "/psy-tel?" + params.toString());
      ws.onopen = () => setStatus(true, "Verbunden mit PSY‑TEL Hotspot");
      ws.onclose = (event) => {
        if (event.code === 4401) {
          setStatus(false, "Zugangscode erforderlich");
          showGate(true);
          return;
        }
        if (event.code === 4400) {
          setStatus(false, "Kein Raum angegeben – bitte den Link des Betreibers verwenden.");
          return;
        }
        setStatus(false, "Verbindung getrennt – erneuter Versuch …");
        setTimeout(connect, 2000);
      };
      ws.onerror = () => setStatus(false, "Verbindungsfehler");
      ws.onmessage = ev => {
        const data = JSON.parse(ev.data);
        if (data.type === "transposer-broadcast") {
          applyState(data);
        }
      };
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (!room) {
        setStatus(false, "Kein Raum angegeben – bitte den Link/QR-Code des Betreibers verwenden.");
        return;
      }
      document.getElementById("gateJoin").addEventListener("click", joinWithPasscode);
      loadInitialState();
      connect();
    });
  </script>
</body>
</html>
