<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VOS OS · Das digitale Schweizer Taschenmesser</title>
<meta name="description" content="VOS OS — Windows-95-Hommage mit Notizbuch, Werkzeugkasten, App Maker, System-Kommandozentrale, Service-Store & bunq-Kasse. Von Raymond Demitrio Tel · TTT-SYSTEMS." />
<style>
  :root{
    --w95-bg:#008080; --w95-face:#c0c0c0; --w95-shadow:#808080; --w95-dark:#404040;
    --w95-light:#ffffff; --w95-blue:#000080; --w95-text:#000; --w95-title:#fff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:"Segoe UI","Tahoma",sans-serif; }
  body{ background:var(--w95-bg); overflow:hidden; user-select:none; -webkit-user-select:none; }

  /* ============ BOOT SPLASH ============ */
  #boot{ position:fixed; inset:0; background:#000; color:#c0c0c0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"Courier New",monospace; transition:opacity .6s; }
  #boot .logo{ font-size:2.4rem; font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#00c8c8,#7affff,#00c8c8); -webkit-background-clip:text;
    background-clip:text; color:transparent; margin-bottom:6px; }
  #boot .sub{ color:#6cc; font-size:.9rem; margin-bottom:26px; }
  #boot .bar{ width:280px; height:18px; border:2px solid #444; background:#111; padding:2px; }
  #boot .fill{ height:100%; width:0; background:repeating-linear-gradient(90deg,#00a0a0 0 10px,#008080 10px 14px); transition:width .1s; }
  #boot .lines{ margin-top:18px; font-size:.72rem; color:#4a8; height:60px; text-align:left; width:280px; }

  /* ============ DESKTOP ============ */
  #desktop{ position:fixed; inset:0 0 34px 0; padding:14px; display:flex; flex-direction:column;
    flex-wrap:wrap; align-content:flex-start; gap:4px; }
  .icon{ width:84px; padding:8px 4px; text-align:center; cursor:pointer; border:1px solid transparent; border-radius:3px; }
  .icon:hover{ background:rgba(0,0,128,.25); border-color:rgba(255,255,255,.35); }
  .icon .em{ font-size:2rem; display:block; filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5)); }
  .icon .lbl{ color:#fff; font-size:.74rem; margin-top:4px; text-shadow:1px 1px 1px #000; word-wrap:break-word; }

  /* ============ WINDOWS ============ */
  .win{ position:absolute; min-width:280px; background:var(--w95-face);
    border-top:2px solid var(--w95-light); border-left:2px solid var(--w95-light);
    border-right:2px solid var(--w95-dark); border-bottom:2px solid var(--w95-dark);
    box-shadow:2px 2px 0 rgba(0,0,0,.4); display:none; flex-direction:column; z-index:10; }
  .win.open{ display:flex; }
  .win .title{ background:linear-gradient(90deg,var(--w95-blue),#1084d0); color:var(--w95-title);
    font-weight:700; font-size:.82rem; padding:3px 4px 3px 6px; display:flex; align-items:center;
    justify-content:space-between; cursor:move; }
  .win .title .t{ display:flex; align-items:center; gap:6px; }
  .win .title .btns{ display:flex; gap:2px; }
  .win .title button{ width:18px; height:16px; border-top:1px solid var(--w95-light);
    border-left:1px solid var(--w95-light); border-right:1px solid var(--w95-dark);
    border-bottom:1px solid var(--w95-dark); background:var(--w95-face); color:#000;
    font-size:.7rem; font-weight:900; cursor:pointer; line-height:1; padding:0; }
  .win .body{ padding:10px; overflow:auto; font-size:.84rem; color:#000; background:var(--w95-face); }
  .win .body.pad0{ padding:0; }

  /* W95 form controls */
  .field{ width:100%; padding:5px 7px; border-top:2px solid var(--w95-shadow);
    border-left:2px solid var(--w95-shadow); border-right:2px solid var(--w95-light);
    border-bottom:2px solid var(--w95-light); background:#fff; color:#000; font-family:inherit;
    font-size:.82rem; }
  textarea.field{ resize:vertical; font-family:"Consolas","Courier New",monospace; }
  .btn{ padding:5px 12px; cursor:pointer; background:var(--w95-face); color:#000; font-family:inherit;
    font-size:.8rem; font-weight:600; border-top:2px solid var(--w95-light);
    border-left:2px solid var(--w95-light); border-right:2px solid var(--w95-dark);
    border-bottom:2px solid var(--w95-dark); }
  .btn:active{ border-top:2px solid var(--w95-dark); border-left:2px solid var(--w95-dark);
    border-right:2px solid var(--w95-light); border-bottom:2px solid var(--w95-light); }
  .btn.pri{ background:#000080; color:#fff; }
  .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  label.lb{ font-size:.78rem; font-weight:700; display:block; margin:8px 0 3px; }
  .out{ font-family:"Consolas","Courier New",monospace; font-size:.78rem; background:#fff;
    border:2px inset #808080; padding:6px; white-space:pre-wrap; word-break:break-all; min-height:34px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:2px; background:#c0c0c0; padding:4px 4px 0; }
  .tab{ padding:5px 10px; cursor:pointer; font-size:.76rem; background:var(--w95-face);
    border-top:2px solid var(--w95-light); border-left:2px solid var(--w95-light);
    border-right:2px solid var(--w95-dark); border-bottom:none; }
  .tab.active{ background:#dcdcdc; font-weight:700; position:relative; top:1px; }
  .panel{ display:none; padding:10px; background:#dcdcdc; }
  .panel.active{ display:block; }
  .game-wrap{ text-align:center; }
  .game-cv{ background:#000; border:2px inset #fff; touch-action:none; }
  .game-hud{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.82rem; margin:2px 0 8px; }
  .ms-grid{ display:inline-grid; gap:0; background:#808080; padding:3px; border:3px inset #fff; }
  .ms-cell{ width:22px; height:22px; font-weight:700; font-size:.82rem; line-height:20px; text-align:center;
    background:#c0c0c0; border:2px outset #fff; cursor:pointer; user-select:none; padding:0; }
  .ms-cell.open{ border:1px solid #9a9a9a; background:#bdbdbd; cursor:default; }
  .ms-cell.mine{ background:#ff5252; }
  .mem-grid{ display:inline-grid; grid-template-columns:repeat(4,54px); gap:6px; }
  .mem-card{ width:54px; height:54px; font-size:1.7rem; line-height:54px; text-align:center; cursor:pointer;
    background:#000080; color:#000080; border:2px outset #fff; border-radius:4px; }
  .mem-card.flip{ background:#dcdcdc; color:#000; }
  .mem-card.done{ background:#7fd77f; color:#000; cursor:default; }
  .ttt-grid{ display:inline-grid; grid-template-columns:repeat(3,64px); gap:3px; background:#808080; padding:3px; }
  .ttt-cell{ width:64px; height:64px; font-size:2.1rem; font-weight:900; background:#c0c0c0; border:2px outset #fff; cursor:pointer; }
  .g2048-grid{ display:inline-grid; grid-template-columns:repeat(4,58px); gap:6px; background:#8b7d70; padding:6px; border-radius:6px; }
  .g2048-cell{ width:58px; height:58px; line-height:58px; text-align:center; font-weight:800; border-radius:4px; background:#cdc1b4; color:#000; font-size:1.1rem; }
  .warn{ background:#ffffcc; border:2px solid #cc0000; color:#800; padding:8px;
    font-size:.78rem; margin:8px 0; }
  .note{ font-size:.72rem; color:#333; margin-top:4px; }
  a{ color:#000080; }

  /* ============ TASKBAR ============ */
  #taskbar{ position:fixed; left:0; right:0; bottom:0; height:34px; background:var(--w95-face);
    border-top:2px solid var(--w95-light); display:flex; align-items:center; gap:5px; padding:0 5px; z-index:5000; }
  #startbtn{ display:flex; align-items:center; gap:6px; font-weight:800; font-size:.84rem;
    padding:4px 10px; cursor:pointer; border-top:2px solid var(--w95-light);
    border-left:2px solid var(--w95-light); border-right:2px solid var(--w95-dark);
    border-bottom:2px solid var(--w95-dark); background:var(--w95-face); }
  #startbtn.on{ border-top:2px solid var(--w95-dark); border-left:2px solid var(--w95-dark);
    border-right:2px solid var(--w95-light); border-bottom:2px solid var(--w95-light); }
  #tasklist{ flex:1; display:flex; gap:4px; overflow:hidden; }
  .taskitem{ font-size:.76rem; padding:3px 10px; max-width:160px; overflow:hidden; white-space:nowrap;
    text-overflow:ellipsis; cursor:pointer; border-top:2px solid var(--w95-light);
    border-left:2px solid var(--w95-light); border-right:2px solid var(--w95-dark);
    border-bottom:2px solid var(--w95-dark); background:var(--w95-face); }
  .taskitem.active{ border-top:2px solid var(--w95-dark); border-left:2px solid var(--w95-dark);
    border-right:2px solid var(--w95-light); border-bottom:2px solid var(--w95-light); background:#dcdcdc; }
  #clock{ font-size:.78rem; padding:4px 8px; border:2px inset #808080; min-width:64px; text-align:center; }

  /* ============ START MENU ============ */
  #startmenu{ position:fixed; left:5px; bottom:36px; width:250px; background:var(--w95-face);
    border-top:2px solid var(--w95-light); border-left:2px solid var(--w95-light);
    border-right:2px solid var(--w95-dark); border-bottom:2px solid var(--w95-dark);
    z-index:6000; display:none; }
  #startmenu.open{ display:flex; }
  #startmenu .side{ width:32px; background:linear-gradient(#000080,#1084d0); color:#fff;
    writing-mode:vertical-rl; text-orientation:mixed; font-weight:900; font-size:1rem;
    text-align:center; padding:8px 0; letter-spacing:2px; transform:rotate(180deg); }
  #startmenu .items{ flex:1; padding:4px; }
  .smi{ display:flex; align-items:center; gap:10px; padding:6px 8px; cursor:pointer; font-size:.84rem; }
  .smi:hover{ background:#000080; color:#fff; }
  .smi .em{ font-size:1.1rem; width:22px; text-align:center; }
  .smsep{ height:1px; background:var(--w95-shadow); border-bottom:1px solid var(--w95-light); margin:4px 2px; }

  /* store / bunq specifics */
  .kasse{ background:linear-gradient(160deg,#0a3d2e,#062018); color:#d8ffe8; border-radius:6px; padding:14px; }
  .kasse h3{ margin:0 0 8px; color:#5effa0; }
  .amt-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; }
  .amt{ padding:10px 0; text-align:center; cursor:pointer; font-weight:800; border-radius:6px;
    background:#0e5b41; color:#eafff3; border:1px solid #1c8a63; }
  .amt.sel,.amt:hover{ background:#17c07f; color:#042; }
  .paybtn{ display:block; width:100%; text-align:center; text-decoration:none; padding:13px;
    border-radius:8px; font-weight:900; font-size:1rem; margin-top:10px;
    background:linear-gradient(90deg,#17c07f,#5effa0); color:#042; }
  .contact-card{ background:#fff; border:2px inset #808080; padding:10px; font-size:.8rem; line-height:1.6; }
  .badge{ display:inline-block; background:#000080; color:#fff; font-size:.68rem; padding:2px 7px;
    border-radius:3px; margin:2px 2px 0 0; }
  .book h4{ margin:12px 0 4px; color:#000080; }
  .book p{ margin:4px 0; font-size:.8rem; line-height:1.55; }
  .book pre{ background:#f4f4f4; border:1px solid #aaa; padding:8px; font-size:.72rem; overflow:auto; }
  .arch{ display:flex; flex-direction:column; gap:3px; margin:6px 0; }
  .arch .layer{ padding:7px 10px; color:#fff; font-size:.78rem; font-weight:700; border-radius:3px; }

  /* ============ LOGO-PHASE (Kugel/Kernel nach Win95-Start) ============ */
  #logoPhase{ position:fixed; inset:0; z-index:9998; display:none; flex-direction:column;
    align-items:center; justify-content:center; opacity:0; transition:opacity .8s;
    background:radial-gradient(circle at 50% 45%, #04141c 0%, #000 70%); }
  #logoPhase.show{ display:flex; opacity:1; }
  .lp-orb{ width:240px; height:240px; }
  .lp-cap{ margin-top:24px; color:#7affff; font-family:"Courier New",monospace; letter-spacing:2px;
    font-size:.92rem; min-height:20px; text-shadow:0 0 8px rgba(0,224,224,.6); }
  .lp-cap b{ color:#fff3c4; }

  /* Kugel/Sphere SVG (transparent, drehend, rotierender Kern) */
  .vos-sphere{ width:100%; height:100%; overflow:visible; }
  .vos-sphere .outline{ fill:rgba(0,224,224,.04); stroke:#00e0e0; stroke-width:1; }
  .vos-sphere .ring{ fill:none; stroke:#39f6ff; stroke-width:1; opacity:.5; }
  .vos-sphere .spin{ transform-origin:50% 50%; animation:sph-spin 9s linear infinite; }
  .vos-sphere .spin2{ transform-origin:50% 50%; animation:sph-spin 6s linear infinite reverse; }
  .vos-sphere .core{ transform-origin:50% 50%; animation:core-spin 3.2s linear infinite; }
  .vos-sphere .halo{ transform-origin:50% 50%; animation:halo-pulse 2.6s ease-in-out infinite; }
  @keyframes sph-spin{ to{ transform:rotate(360deg);} }
  @keyframes core-spin{ to{ transform:rotate(-360deg);} }
  @keyframes halo-pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.9; } }

  /* Schwebende Desktop-Kugel */
  #deskSphere{ position:fixed; right:44px; bottom:74px; width:150px; height:150px; z-index:3;
    pointer-events:none; display:none; filter:drop-shadow(0 0 18px rgba(0,224,224,.5));
    animation:sph-float 6s ease-in-out infinite; }
  #deskSphere.show{ display:block; }
  @keyframes sph-float{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-16px);} }

  /* Systemsteuerung — Theme-Voransicht */
  .thm-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0; }
  .thm{ cursor:pointer; border:2px solid #808080; overflow:hidden; }
  .thm .pv{ height:50px; }
  .thm .nm{ font-size:.7rem; padding:3px 4px; background:#c0c0c0; text-align:center; }
  .thm.sel{ border-color:#000080; box-shadow:0 0 0 2px #1084d0 inset; }
  .slider{ width:100%; }

  /* Gauges (System-Analyse) */
  .gauge-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:6px 0; }
  .gauge{ background:#001; border:2px inset #808080; padding:8px; text-align:center;
    color:#0f0; font-family:"Courier New",monospace; }
  .gauge .val{ font-size:1.3rem; font-weight:900; }
  .gauge .lbl2{ font-size:.66rem; color:#3fa; }
  .bar-meter{ height:9px; background:#111; border:1px solid #333; margin-top:5px; }
  .bar-meter i{ display:block; height:100%; background:linear-gradient(90deg,#0f0,#3f6); width:0; }

  /* Oszilloskop */
  .scope-canvas{ width:100%; height:200px; background:#001208; border:2px inset #808080; display:block; }

  /* Story / Bericht */
  .story{ background:#fff; border:2px inset #808080; padding:12px; font-size:.84rem;
    line-height:1.6; max-height:300px; overflow:auto; }
  .story h4{ color:#000080; margin:10px 0 4px; }
  .frame{ width:100%; height:340px; border:2px inset #808080; background:#fff; }
</style>

</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="logo">VOS&nbsp;OS</div>
  <div class="sub">Verstehen durch Visualisierung · v9.7</div>
  <div class="bar"><div class="fill" id="bootFill"></div></div>
  <div class="lines" id="bootLines"></div>
</div>

<!-- DESKTOP -->
<div id="desktop"></div>

<!-- LOGO-PHASE (erscheint NACH der natürlichen Win95-Startsequenz) -->
<div id="logoPhase"><div class="lp-orb" id="lpOrb"></div><div class="lp-cap" id="lpCap"></div></div>

<!-- Schwebende Desktop-Kugel (Kernel), per Einstellungen steuerbar -->
<div id="deskSphere"></div>

<!-- TASKBAR -->
<div id="taskbar">
  <div id="startbtn"><span style="font-size:1rem">🪟</span> Start</div>
  <div id="tasklist"></div>
  <div id="clock">--:--</div>
</div>

<!-- START MENU -->
<div id="startmenu">
  <div class="side">VOS&nbsp;OS</div>
  <div class="items" id="startItems"></div>
</div>

<script>
"use strict";
/* =================================================================
   VOS OS — Client-only Windows-95-Hommage · Schweizer Taschenmesser
   Autor: Raymond Demitrio Tel · TEL1.NL · TTT-SYSTEMS
   Alles läuft im Browser (file:// & GitHub Pages). Keine Installation.
   ================================================================= */

/* ---------- App-Definitionen ---------- */
var APPS = [
  { id:"settings",icon:"⚙️", name:"Einstellungen",         w:560, h:500 },
  { id:"notiz",  icon:"📝", name:"Notizbuch",              w:460, h:420 },
  { id:"tools",  icon:"🧰", name:"Werkzeugkasten",         w:520, h:470 },
  { id:"calc",   icon:"🧮", name:"Rechner & Monteur",      w:360, h:480 },
  { id:"elab",   icon:"⚡", name:"Elektronik-Labor",       w:520, h:500 },

  { id:"sysinfo",icon:"🖥️", name:"System-Analyse",         w:560, h:520 },
  { id:"maker",  icon:"🛠️", name:"App Maker",              w:640, h:520 },
  { id:"gomaker",icon:"🐹", name:"Go App Maker",           w:640, h:520 },
  { id:"appstore",icon:"🛍️",name:"App Store (EOS)",        w:560, h:520 },
  { id:"games",  icon:"🎮", name:"Spiele-Center",          w:660, h:580 },
  { id:"studio", icon:"🎬", name:"Media-Studio",           w:640, h:540 },
  { id:"office", icon:"📄", name:"Office-Suite",           w:640, h:540 },
  { id:"qr",     icon:"▦",  name:"QR-Code Generator",      w:440, h:500 },
  { id:"clock",  icon:"🕐", name:"Uhren & Zeit",           w:520, h:500 },
  { id:"wallet", icon:"🦊", name:"Wallet & Bank",          w:520, h:520 },
  { id:"cmd",    icon:"💻", name:"System-Kommandozentrale",w:600, h:500 },
  { id:"usb",    icon:"💾", name:"USB-Boot-Kit",           w:560, h:500 },
  { id:"browser",icon:"🌐", name:"Web-Browser",            w:640, h:520 },
  { id:"media",  icon:"🎵", name:"Multimedia",             w:540, h:480 },
  { id:"voice",  icon:"🎤", name:"Sprachsteuerung",        w:460, h:420 },
  { id:"api",    icon:"🔑", name:"API & Tokens",           w:540, h:480 },

  { id:"memorial",icon:"🕯️",name:"Memorial",              w:460, h:460 },
  { id:"fbreport",icon:"📘",name:"FB-Bericht (offline)",   w:520, h:500 },
  { id:"inspire",icon:"💡", name:"db.com Inspiration",     w:500, h:460 },
  { id:"w95hist",icon:"🕹️", name:"Windows-95-Geschichte",  w:560, h:500 },
  { id:"xmas",   icon:"🎄", name:"Kindergeschichte",       w:520, h:480 },
  { id:"store",  icon:"🏪", name:"Service-Store & bunq",   w:520, h:560 },
  { id:"book",   icon:"📖", name:"Systembuch (VOS OS)",    w:600, h:540 },
  { id:"about",  icon:"ℹ️", name:"Über VOS OS",            w:420, h:360 }
];

var Z = 10;
var winState = {};
var CLEANUP = {};   /* pro Fenster registrierte Aufräum-Funktion (Timer/Audio/Streams) */

/* ---------- Globale Lautstärke (persistent, von allen Audio-Apps geteilt) ---------- */
function vosGetVol(){ var v=parseFloat(localStorage.getItem("vos.vol")); return isNaN(v)?0.6:Math.max(0,Math.min(1,v)); }
function vosSetVol(v){ v=Math.max(0,Math.min(1,v)); localStorage.setItem("vos.vol",v);
  document.querySelectorAll(".vos-vol").forEach(function(s){ if(+s.value!==Math.round(v*100)) s.value=Math.round(v*100); });
  document.querySelectorAll(".vos-vol-lbl").forEach(function(l){ l.textContent=Math.round(v*100)+"%"; });
  if(window.__vosVolListeners) window.__vosVolListeners.forEach(function(fn){ try{fn(v);}catch(e){} });
  return v; }
window.__vosVolListeners = [];
function vosVolControl(){ return '<div class="row" style="align-items:center"><span class="lb" style="margin:0">🔊 Lautstärke</span>'+
  '<input type="range" min="0" max="100" value="'+Math.round(vosGetVol()*100)+'" class="slider vos-vol" style="flex:1">'+
  '<span class="vos-vol-lbl" style="min-width:38px;text-align:right">'+Math.round(vosGetVol()*100)+'%</span></div>'; }
function vosVolWire(root){ (root||document).querySelectorAll(".vos-vol").forEach(function(s){ s.oninput=function(){ vosSetVol(+this.value/100); }; }); }

/* ---------- Fenster erstellen/öffnen ---------- */
function openApp(id){
  var app = APPS.find(function(a){ return a.id===id; });
  if (!app) return;
  var w = document.getElementById("win-"+id);
  if (!w){
    w = document.createElement("div");
    w.className = "win"; w.id = "win-"+id;
    w.style.width = app.w+"px";
    var left = 40 + (Object.keys(winState).length*26)%260;
    var top  = 30 + (Object.keys(winState).length*22)%160;
    w.style.left = left+"px"; w.style.top = top+"px";
    w.innerHTML =
      '<div class="title" data-drag="'+id+'"><span class="t">'+app.icon+' '+app.name+'</span>'+
      '<span class="btns"><button data-min="'+id+'">_</button><button data-close="'+id+'">✕</button></span></div>'+
      '<div class="body" id="body-'+id+'" style="max-height:'+app.h+'px"></div>';
    document.body.appendChild(w);
    document.getElementById("body-"+id).innerHTML = RENDER[id] ? RENDER[id]() : "";
    if (INIT[id]) INIT[id]();
    makeDraggable(w, w.querySelector(".title"));
    winState[id] = true;
    addTask(app);
  }
  w.classList.add("open");
  focusWin(w, id);
  setTaskActive(id);
}
function focusWin(w, id){ Z++; w.style.zIndex = Z; }
function closeApp(id){
  var w = document.getElementById("win-"+id);
  if (w){ if(id==="games" && window.__vosGamesStop) window.__vosGamesStop();
    if(CLEANUP[id]){ try{CLEANUP[id]();}catch(e){} delete CLEANUP[id]; }
    w.remove(); delete winState[id]; removeTask(id); }
}
function minApp(id){
  var w = document.getElementById("win-"+id);
  if (w){ w.classList.remove("open"); setTaskActive(null); }
}

/* ---------- Taskbar ---------- */
function addTask(app){
  if (document.getElementById("task-"+app.id)) return;
  var t = document.createElement("div");
  t.className = "taskitem active"; t.id = "task-"+app.id;
  t.innerHTML = app.icon+" "+app.name;
  t.onclick = function(){
    var w = document.getElementById("win-"+app.id);
    if (w.classList.contains("open") && +w.style.zIndex===Z){ minApp(app.id); }
    else { w.classList.add("open"); focusWin(w, app.id); setTaskActive(app.id); }
  };
  document.getElementById("tasklist").appendChild(t);
}
function removeTask(id){ var t=document.getElementById("task-"+id); if(t) t.remove(); }
function setTaskActive(id){
  document.querySelectorAll(".taskitem").forEach(function(t){
    t.classList.toggle("active", t.id==="task-"+id);
  });
}

/* ---------- Draggable ---------- */
function makeDraggable(win, handle){
  var sx,sy,ox,oy,drag=false;
  handle.addEventListener("mousedown", function(e){
    if (e.target.tagName==="BUTTON") return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=parseInt(win.style.left); oy=parseInt(win.style.top);
    Z++; win.style.zIndex=Z; e.preventDefault();
  });
  document.addEventListener("mousemove", function(e){
    if(!drag) return;
    win.style.left=Math.max(0,ox+e.clientX-sx)+"px";
    win.style.top=Math.max(0,oy+e.clientY-sy)+"px";
  });
  document.addEventListener("mouseup", function(){ drag=false; });
  win.addEventListener("mousedown", function(){ Z++; win.style.zIndex=Z; });
}

INIT.scope = function(){
  var $=function(id){return document.getElementById(id);};

  function draw(){ raf=requestAnimationFrame(draw); if(!an)return; an.getByteTimeDomainData(buf);
    cx.fillStyle="#001208"; cx.fillRect(0,0,cv.width,cv.height); cx.strokeStyle="#0a3"; cx.lineWidth=1;
    for(var gx=0;gx<cv.width;gx+=40){cx.beginPath();cx.moveTo(gx,0);cx.lineTo(gx,cv.height);cx.stroke();}
    for(var gy=0;gy<cv.height;gy+=40){cx.beginPath();cx.moveTo(0,gy);cx.lineTo(cv.width,gy);cx.stroke();}
    cx.strokeStyle="#3dff88"; cx.lineWidth=2; cx.beginPath(); var sl=cv.width/buf.length;
    for(var i=0;i<buf.length;i++){ var y=buf[i]/128*cv.height/2, x=i*sl; if(i===0)cx.moveTo(x,y); else cx.lineTo(x,y);} cx.stroke(); }

    gain=ac.createGain(); gain.gain.value=vosGetVol(); osc.connect(gain); gain.connect(an); gain.connect(ac.destination); osc.start(); if(!raf)draw(); };
  $("scMic").onclick=function(){ if(!navigator.mediaDevices){alert("Mikrofon nicht verfügbar.");return;} ctx(); stopSrc();
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){ stream=s; ac.createMediaStreamSource(s).connect(an); if(!raf)draw(); }).catch(function(){alert("Mikrofon-Zugriff verweigert.");}); };

  window.__vosVolListeners.push(volFn);

    var idx=window.__vosVolListeners.indexOf(volFn); if(idx>=0)window.__vosVolListeners.splice(idx,1);

    hand((h+m/60)*Math.PI/6,52,5,"#000"); hand((m+s/60)*Math.PI/30,74,3,"#000"); hand(s*Math.PI/30,82,1,"#c00"); x.restore(); }
  var iv=setInterval(function(){ world(); analog(); },1000); world(); analog();

INIT.games = function(){
  var G = {};
  var active = null;
  function typing(){ var a=document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }

  /* ---- 💣 Minesweeper ---- */
  G.mines = (function(){
    var R=9,C=9,M=10,grid,rev,flag,over,win,started,t0,timer;
    var COL={1:"#0000ff",2:"#008000",3:"#ff0000",4:"#000080",5:"#800000",6:"#008080",7:"#000",8:"#808080"};
    function neigh(r,c,fn){ for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){ if(!dr&&!dc)continue; var rr=r+dr,cc=c+dc; if(rr>=0&&rr<R&&cc>=0&&cc<C)fn(rr,cc); } }
    function build(){
      clearInterval(timer); grid=[];rev=[];flag=[];
      for(var r=0;r<R;r++){ grid.push([]);rev.push([]);flag.push([]); for(var c=0;c<C;c++){ grid[r].push(0);rev[r].push(false);flag[r].push(false); } }
      var placed=0; while(placed<M){ var r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C); if(grid[r][c]!==-1){ grid[r][c]=-1; placed++; } }
      for(var r2=0;r2<R;r2++)for(var c2=0;c2<C;c2++){ if(grid[r2][c2]===-1)continue; var n=0; neigh(r2,c2,function(rr,cc){ if(grid[rr][cc]===-1)n++; }); grid[r2][c2]=n; }
      over=false;win=false;started=false; render(); hud();
    }
    function reveal(r,c){
      if(over||rev[r][c]||flag[r][c])return;
      if(!started){ started=true; t0=Date.now(); timer=setInterval(hud,500); }
      rev[r][c]=true;
      if(grid[r][c]===-1){ over=true; clearInterval(timer); render(); return; }
      if(grid[r][c]===0)neigh(r,c,function(rr,cc){ if(!rev[rr][cc])reveal(rr,cc); });
      var done=true; for(var r2=0;r2<R;r2++)for(var c2=0;c2<C;c2++){ if(grid[r2][c2]!==-1&&!rev[r2][c2])done=false; }
      if(done){ win=true; over=true; clearInterval(timer); }
      render();
    }
    function hud(){
      var fl=0; if(flag)flag.forEach(function(row){ row.forEach(function(v){ if(v)fl++; }); });
      var mm=document.getElementById("msMines"); if(mm)mm.textContent=M-fl;
      var tt=document.getElementById("msTime"); if(tt)tt.textContent=started?Math.floor((Date.now()-t0)/1000):0;
    }
    function render(){
      var g=document.getElementById("msGrid"); if(!g)return;
      g.style.gridTemplateColumns="repeat("+C+",22px)"; g.innerHTML="";
      for(var r=0;r<R;r++)for(var c=0;c<C;c++){ (function(r,c){
        var b=document.createElement("button"); b.className="ms-cell";
        if(rev[r][c]){ b.classList.add("open");
          if(grid[r][c]===-1){ b.classList.add("mine"); b.textContent="💣"; }
          else if(grid[r][c]>0){ b.textContent=grid[r][c]; b.style.color=COL[grid[r][c]]||"#000"; }
        } else if(flag[r][c]){ b.textContent="🚩"; }
        b.oncontextmenu=function(e){ e.preventDefault(); if(over||rev[r][c])return; flag[r][c]=!flag[r][c]; render(); hud(); };
        b.onclick=function(){ reveal(r,c); };
        g.appendChild(b);
      })(r,c); }
      var f=document.getElementById("msFace"); if(f)f.textContent=over?(win?"😎":"😵"):"🙂";
    }
    return { start:function(){ build(); var f=document.getElementById("msFace"); if(f)f.onclick=build; }, stop:function(){ clearInterval(timer); } };
  })();

  /* ---- 🐍 Snake ---- */
  G.snake = (function(){
    var cv,ctx,N=20,S=15,snake,dir,ndir,food,score,loop,dead,elS;
    function rnd(){ var f; do{ f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; }while(snake&&snake.some(function(s){return s.x===f.x&&s.y===f.y;})); return f; }
    function reset(){ snake=[{x:10,y:10}]; dir={x:1,y:0}; ndir=dir; score=0; dead=false; food=rnd(); if(elS)elS.textContent=0; draw(); }
    function step(){
      dir=ndir; var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x===h.x&&s.y===h.y;})){ dead=true; draw(); return; }
      snake.unshift(h);
      if(h.x===food.x&&h.y===food.y){ score++; if(elS)elS.textContent=score; food=rnd(); } else snake.pop();
      draw();
    }
    function draw(){
      if(!ctx)return; ctx.fillStyle="#001a08"; ctx.fillRect(0,0,N*S,N*S);
      snake.forEach(function(s,i){ ctx.fillStyle=i?"#33ff99":"#7fffd4"; ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); });
      ctx.fillStyle="#ff5252"; ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
      if(dead){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,N*S,N*S); ctx.fillStyle="#fff"; ctx.font="15px sans-serif"; ctx.textAlign="center"; ctx.fillText("Game Over — 🔄 Neu",N*S/2,N*S/2); }
    }
    function key(e){ if(typing())return; var k=e.key,nd;
      if(k==="ArrowUp"&&dir.y===0)nd={x:0,y:-1}; else if(k==="ArrowDown"&&dir.y===0)nd={x:0,y:1};
      else if(k==="ArrowLeft"&&dir.x===0)nd={x:-1,y:0}; else if(k==="ArrowRight"&&dir.x===0)nd={x:1,y:0}; else return;
      ndir=nd; e.preventDefault();
    }
    return {
      start:function(){ cv=document.getElementById("snkCv"); ctx=cv.getContext("2d"); elS=document.getElementById("snkScore");
        document.addEventListener("keydown",key); reset(); loop=setInterval(function(){ if(!dead)step(); },110);
        var nb=document.getElementById("snkNew"); if(nb)nb.onclick=reset; },
      stop:function(){ clearInterval(loop); document.removeEventListener("keydown",key); }
    };
  })();

  /* ---- 🧱 Tetris ---- */
  G.tetris = (function(){
    var cv,ctx,COLS=10,ROWS=20,S=20,board,cur,px,py,score,lines,loop,over,elS,elL,dropMs,acc,lastT;
    var SH={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
    var CC={I:"#00f0f0",O:"#f0f000",T:"#a000f0",S:"#00f000",Z:"#f00000",J:"#0000f0",L:"#f0a000"};
    var K=Object.keys(SH);
    function newBoard(){ board=[]; for(var r=0;r<ROWS;r++){ board.push([]); for(var c=0;c<COLS;c++)board[r].push(null); } }
    function collide(x,y,m){ for(var r=0;r<m.length;r++)for(var c=0;c<m[r].length;c++){ if(!m[r][c])continue; var nx=x+c,ny=y+r; if(nx<0||nx>=COLS||ny>=ROWS)return true; if(ny>=0&&board[ny][nx])return true; } return false; }
    function spawn(){ var k=K[Math.floor(Math.random()*K.length)]; cur={m:SH[k].map(function(row){return row.slice();}),k:k}; px=Math.floor((COLS-cur.m[0].length)/2); py=0; if(collide(px,py,cur.m))over=true; }

  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tabsWire(tabsId, winId){
  document.querySelectorAll("#"+tabsId+" .tab").forEach(function(tab){
    tab.onclick=function(){
      document.querySelectorAll("#"+tabsId+" .tab").forEach(function(t){t.classList.remove("active");});
      document.querySelectorAll("#"+winId+" .panel").forEach(function(p){p.classList.remove("active");});
      tab.classList.add("active");

    for(c=0;c<size;c++){ var run2=1; for(r=1;r<size;r++){ if(m[r][c]===m[r-1][c])run2++; else{ if(run2>=5)lost+=3+(run2-5); run2=1; } } if(run2>=5)lost+=3+(run2-5); }
    for(r=0;r<size-1;r++)for(c=0;c<size-1;c++){ var s=m[r][c]+m[r+1][c]+m[r][c+1]+m[r+1][c+1]; if(s===0||s===4)lost+=3; }
    for(r=0;r<size;r++)for(c=0;c<size-6;c++){ if(m[r][c]&&!m[r][c+1]&&m[r][c+2]&&m[r][c+3]&&m[r][c+4]&&!m[r][c+5]&&m[r][c+6])lost+=40; }
    for(c=0;c<size;c++)for(r=0;r<size-6;r++){ if(m[r][c]&&!m[r+1][c]&&m[r+2][c]&&m[r+3][c]&&m[r+4][c]&&!m[r+5][c]&&m[r+6][c])lost+=40; }
    var dark=0; for(r=0;r<size;r++)for(c=0;c<size;c++) if(m[r][c])dark++;
    lost+=Math.floor(Math.abs(100*dark/(size*size)-50)/5)*10; return lost; }
  function make(text){
    var enc=unescape(encodeURIComponent(text)), bytes=[]; for(var i=0;i<enc.length;i++)bytes.push(enc.charCodeAt(i)&0xff);
    var ver=0; for(var v=1;v<=5;v++){ if(4+8+bytes.length*8 <= VER[v].data*8){ ver=v; break; } }
    if(!ver) throw new Error("Text zu lang für QR (max ~106 Zeichen).");
    var info=VER[ver], buf=[]; function put(val,len){ for(var b=len-1;b>=0;b--)buf.push((val>>b)&1); }
    put(4,4); put(bytes.length,8); for(var i=0;i<bytes.length;i++)put(bytes[i],8);
    var cap=info.data*8, term=Math.min(4,cap-buf.length); for(var t=0;t<term;t++)buf.push(0);
    while(buf.length%8!==0)buf.push(0);
    var dcw=[]; for(var i=0;i<buf.length;i+=8){ var b=0; for(var k=0;k<8;k++)b=(b<<1)|buf[i+k]; dcw.push(b); }
    var pads=[0xEC,0x11],pi=0; while(dcw.length<info.data){ dcw.push(pads[pi%2]); pi++; }
    var all=dcw.concat(rsEncode(dcw,info.ec));
    var size=17+4*ver, base=[]; for(var r=0;r<size;r++){ base.push(new Array(size)); for(var c=0;c<size;c++)base[r][c]=null; }
    finder(base,size,0,0); finder(base,size,0,size-7); finder(base,size,size-7,0);
    timing(base,size); align(base,size,info.align); reserve(base,size);
    var best=null,bp=1e9; for(var p=0;p<8;p++){ var mm=clone(base,size); mapData(mm,size,all,p); placeFormat(mm,size,1,p); var pen=penalty(mm,size); if(pen<bp){bp=pen;best=mm;} }
    return {size:size,m:best};
  }
  return { make:make };
})();
function qrToCanvas(text, canvas, scale){
  var q=QR8.make(text), s=scale||6, size=q.size, quiet=4;
  canvas.width=(size+quiet*2)*s; canvas.height=canvas.width;
  var x=canvas.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,canvas.width,canvas.height);
  x.fillStyle="#000"; for(var r=0;r<size;r++)for(var c=0;c<size;c++){ if(q.m[r][c]) x.fillRect((c+quiet)*s,(r+quiet)*s,s,s); }
}

/* ---------- Desktop-Icons & Start-Menü aufbauen ---------- */
(function build(){
  var d=document.getElementById("desktop");
  APPS.forEach(function(a){
    var ic=document.createElement("div"); ic.className="icon";
    ic.innerHTML='<span class="em">'+a.icon+'</span><span class="lbl">'+a.name+'</span>';
    ic.ondblclick=function(){ openApp(a.id); };
    ic.onclick=function(e){ if(e.detail===1){} };
    d.appendChild(ic);
  });
  var si=document.getElementById("startItems");
  APPS.forEach(function(a){
    var m=document.createElement("div"); m.className="smi";
    m.innerHTML='<span class="em">'+a.icon+'</span> '+a.name;
    m.onclick=function(){ openApp(a.id); toggleStart(false); };
    si.appendChild(m);
  });
  var sep=document.createElement("div"); sep.className="smsep"; si.appendChild(sep);
  var back=document.createElement("div"); back.className="smi";
  back.innerHTML='<span class="em">🏠</span> Zurück zum Portal';
  back.onclick=function(){ location.href="index.html"; };
  si.appendChild(back);
})();

/* ---------- Start-Button ---------- */
function toggleStart(force){
  var m=document.getElementById("startmenu"), b=document.getElementById("startbtn");
  var open = force!==undefined ? force : !m.classList.contains("open");
  m.classList.toggle("open", open); b.classList.toggle("on", open);
}
document.getElementById("startbtn").onclick=function(e){ e.stopPropagation(); toggleStart(); };
document.addEventListener("click", function(e){
  var m=document.getElementById("startmenu");
  if(m.classList.contains("open") && !m.contains(e.target) && e.target.id!=="startbtn") toggleStart(false);
});

/* ---------- Fenster-Buttons (Schließen/Minimieren) ---------- */
document.addEventListener("click", function(e){
  var t=e.target;
  if(t.tagName==="BUTTON" && t.dataset.close){ e.stopPropagation(); closeApp(t.dataset.close); }
  else if(t.tagName==="BUTTON" && t.dataset.min){ e.stopPropagation(); minApp(t.dataset.min); }
});

/* ---------- Uhr ---------- */
function tick(){ var n=new Date();
  document.getElementById("clock").textContent=n.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
setInterval(tick,1000); tick();

/* ---------- Boot-Sequenz ---------- */
(function boot(){
  try{ applySettings(getSettings()); }catch(e){}
  var fill=document.getElementById("bootFill"), lines=document.getElementById("bootLines");
  var msgs=["Shadow Runtime … OK","Graph Engine … OK","Welten geladen … OK","Werkzeuge bereit … OK","Willkommen bei VOS OS"];
  var p=0, li=0;
  var iv=setInterval(function(){
    p+=8+Math.random()*10; if(p>100)p=100; fill.style.width=p+"%";
    if(li<msgs.length && p>li*20){ lines.innerHTML+="&gt; "+msgs[li]+"<br>"; li++; }
    if(p>=100){ clearInterval(iv); setTimeout(function(){
      var b=document.getElementById("boot"); b.style.opacity="0";
      setTimeout(function(){ b.style.display="none"; runLogoPhase(); },600);
    },400); }
  },130);
})();

/* ---------- Logo-Phase: die schwebende, transparente Kugel mit rotierendem Kern (Kernel) ---------- */
function runLogoPhase(){
  var lp=document.getElementById("logoPhase"), orb=document.getElementById("lpOrb"), cap=document.getElementById("lpCap");
  if(!lp||!orb){ openApp("settings"); return; }
  orb.innerHTML=sphereSVG();
  var caps=["Kernel initialisiert …","Energiekern rotiert …","Systemsphäre stabil …","<b>TTT-SYSTEMS · Kugel online</b>"];
  var i=0; cap.innerHTML=caps[0]; lp.classList.add("show");
  var ci=setInterval(function(){ i++; if(i<caps.length){ cap.innerHTML=caps[i]; } },1100);
  setTimeout(function(){
    clearInterval(ci); lp.style.opacity="0";
    setTimeout(function(){ lp.classList.remove("show"); lp.style.opacity=""; openApp("settings"); },700);
  },5000);
}
